<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間割管理 - Scrum Board</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>時間割管理</h1>
            <a href="../index.html" class="back-link">← 戻る</a>
        </header>

        <section class="form-section">
            <h2 id="form-title">新規登録</h2>
            <form id="timetable-form">
                <input type="hidden" id="timetable-id">
                <div class="form-group">
                    <label for="day_of_week">曜日 <span class="required">*</span></label>
                    <select id="day_of_week" required>
                        <option value="">-- 選択 --</option>
                        <option value="Monday">月曜日</option>
                        <option value="Tuesday">火曜日</option>
                        <option value="Wednesday">水曜日</option>
                        <option value="Thursday">木曜日</option>
                        <option value="Friday">金曜日</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="period">時限 <span class="required">*</span></label>
                    <input type="number" id="period" required placeholder="例: 1" min="1" max="5">
                </div>
                <div class="form-group">
                    <label for="teacher_id">教員 <span class="required">*</span></label>
                    <select id="teacher_id" required>
                        <option value="">-- 選択 --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="classroom_id">教室 <span class="required">*</span></label>
                    <select id="classroom_id" required>
                        <option value="">-- 選択 --</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 10px;">
                    <input type="checkbox" id="is_online" style="width: auto;">
                    <label for="is_online" style="margin-bottom: 0;">オンライン授業とする</label>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submit-btn">登録</button>
                    <button type="button" id="cancel-btn" style="display:none;" onclick="resetForm()">キャンセル</button>
                </div>
                <p id="form-error" class="error-message" style="display:none;"></p>
            </form>
        </section>

        <section class="action-section">
            <h2>自動生成</h2>
            <p>現在の時間割を全て削除し、教員・教室の重複がない時間割を自動生成します。</p>
            <button id="generate-btn" class="btn-generate" onclick="generateTimetable()">⚡ 自動生成を実行</button>
            <p id="generate-result" class="success-message" style="display:none;"></p>
        </section>

        <section class="calendar-section">
            <h2>週間カレンダー</h2>
            <div id="calendar-controls">
                <button onclick="showWeekCalendar('teacher')" class="btn-filter">教員別表示</button>
                <button onclick="showWeekCalendar('classroom')" class="btn-filter">教室別表示</button>
                <button onclick="showWeekCalendar('all')" class="btn-filter active">全体表示</button>
                <span id="calendar-filter-label" class="filter-label">全体表示</span>
            </div>
            <div id="calendar-loading" class="loading-message" style="display:none;">読み込み中...</div>
            <div id="weekly-calendar"></div>
        </section>

        <section class="list-section">
            <h2>時間割一覧</h2>
            <div id="loading">読み込み中...</div>
            <table id="timetable-table" style="display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>曜日</th>
                        <th>時限</th>
                        <th>教員</th>
                        <th>教室</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="timetable-list"></tbody>
            </table>
            <p id="no-data" style="display:none;">時間割が登録されていません。</p>
        </section>
    </div>

    <script src="../js/timetables.js"></script>
    <script src="../js/timetable_view.js"></script>
</body>
</html>
