<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間割管理 - Schedule Connect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="app">
        <header id="common-admin-header"></header>

        <div class="page-title-bar">
            <div>
                <h1>時間割管理</h1>
                <p class="page-description">制約条件に基づく自動生成、週間カレンダー確認、手動調整</p>
            </div>
        </div>

        <!-- 1. 自動生成セクション（主役） -->
        <section class="card-section" style="border-top: 3px solid #2563eb;">
            <h2>時間割を自動作成</h2>
            <p style="font-size: 14px; color: #475569; margin-bottom: 16px; line-height: 1.6;">
                登録済みの科目（必要コマ数）・担当教員（担当可能科目）・出勤条件（NG日時）をもとに、制約を遵守した時間割を自動生成します。<br>
                <span style="font-size: 12px; color: #64748b;">※生成が成功した場合のみ現在の時間割が置き換わります。条件を満たせない場合は直前の時間割が保持され、不足原因が表示されます。</span>
            </p>
            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                <button id="generate-btn" class="btn-generate" onclick="generateTimetable()">時間割を生成</button>
            </div>
            <div id="generate-result" style="display:none; margin-top: 16px;"></div>
        </section>

        <!-- 2. 週間カレンダーセクション -->
        <section class="calendar-section">
            <h2>週間カレンダー</h2>
            <div id="calendar-controls" class="calendar-controls">
                <button type="button" data-filter="all" onclick="showWeekCalendar('all')" class="btn-filter active">全体表示</button>
                <button type="button" data-filter="teacher" onclick="showFilterModal('teacher')" class="btn-filter">教員別表示</button>
                <button type="button" data-filter="classroom" onclick="showFilterModal('classroom')" class="btn-filter">教室別表示</button>
                <span id="calendar-filter-label" class="filter-label">表示中: 全体</span>
            </div>
            <div id="calendar-loading" class="loading-message" style="display:none;">読み込み中...</div>
            <div id="weekly-calendar"></div>
        </section>

        <!-- 3. 手動調整セクション（補助機能・折りたたみ） -->
        <details id="manual-adjust-section" class="manual-adjust-details">
            <summary class="manual-adjust-summary">
                <span id="manual-summary-title">＋ 手動で授業を追加・調整</span>
                <span style="font-size: 12px; color: #64748b; font-weight: normal;">個別コマの手動設定</span>
            </summary>
            <div class="manual-adjust-body">
                <h3 id="form-title" style="font-size: 14px; font-weight: 600; margin-bottom: 14px; color: #1e293b;">新規登録</h3>
                <form id="timetable-form">
                    <input type="hidden" id="timetable-id">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px;">
                        <div class="form-group">
                            <label for="day_of_week">曜日 <span class="required">*</span></label>
                            <select id="day_of_week" required>
                                <option value="">-- 選択 --</option>
                                <option value="Monday">月曜日</option>
                                <option value="Tuesday">火曜日</option>
                                <option value="Wednesday">水曜日</option>
                                <option value="Thursday">木曜日</option>
                                <option value="Friday">金曜日</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="period">時限 <span class="required">*</span></label>
                            <input type="number" id="period" required placeholder="例: 1" min="1" max="5">
                        </div>
                        <div class="form-group">
                            <label for="teacher_id">教員 <span class="required">*</span></label>
                            <select id="teacher_id" required>
                                <option value="">-- 選択 --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="subject_id">科目 <span class="required">*</span></label>
                            <select id="subject_id" required>
                                <option value="">-- 先に教員を選択してください --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="classroom_id">教室 <span class="required">*</span></label>
                            <select id="classroom_id" required>
                                <option value="">-- 選択 --</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
                        <input type="checkbox" id="is_online" style="width: auto;">
                        <label for="is_online" style="margin-bottom: 0; font-weight: normal;">オンライン授業とする</label>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn-primary">登録</button>
                        <button type="button" id="cancel-btn" class="btn-secondary" style="display:none;" onclick="resetForm()">キャンセル</button>
                    </div>
                    <p id="form-error" class="error-message" style="display:none;"></p>
                </form>
            </div>
        </details>

        <!-- 4. 詳細一覧セクション -->
        <section class="list-section">
            <h2>時間割詳細一覧</h2>
            <div id="loading">読み込み中...</div>
            <table id="timetable-table" style="display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>曜日</th>
                        <th>時限</th>
                        <th>教員</th>
                        <th>科目</th>
                        <th>教室</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="timetable-list"></tbody>
            </table>
            <p id="no-data" style="display:none;">時間割が登録されていません。</p>
        </section>
    </div>

    <script src="../js/admin_nav.js"></script>
    <script src="../js/timetables.js"></script>
    <script src="../js/timetable_view.js"></script>
</body>
</html>
