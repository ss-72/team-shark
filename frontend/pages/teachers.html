<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教員管理 - Scrum Board</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>教員管理</h1>
            <a href="../index.html" class="back-link">← 戻る</a>
        </header>

        <section class="form-section">
            <h2 id="form-title">新規登録</h2>
            <form id="teacher-form">
                <input type="hidden" id="teacher-id">
                <div class="form-group">
                    <label for="name">教員名 <span class="required">*</span></label>
                    <input type="text" id="name" required placeholder="例: 山田 太郎">
                </div>
                <div class="form-group">
                    <label for="employment_type">雇用形態</label>
                    <select id="employment_type">
                        <option value="">-- 選択 --</option>
                        <option value="常勤">常勤</option>
                        <option value="非常勤">非常勤</option>
                        <option value="臨時">臨時</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="department">所属</label>
                    <input type="text" id="department" placeholder="例: 情報工学科">
                </div>
                <div class="form-group">
                    <label for="subject">担当科目</label>
                    <input type="text" id="subject" placeholder="例: データベース">
                </div>
                <div class="form-actions">
                    <button type="submit" id="submit-btn">登録</button>
                    <button type="button" id="cancel-btn" style="display:none;" onclick="resetForm()">キャンセル</button>
                </div>
                <p id="form-error" class="error-message" style="display:none;"></p>
            </form>
        </section>

        <section class="list-section">
            <h2>教員一覧</h2>
            <div id="loading">読み込み中...</div>
            <table id="teacher-table" style="display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>教員名</th>
                        <th>雇用形態</th>
                        <th>所属</th>
                        <th>担当科目</th>
                        <th>担当可能科目・NG時間</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="teacher-list"></tbody>
            </table>
            <p id="no-data" style="display:none;">教員が登録されていません。</p>
        </section>
    </div>

    <script src="../js/teachers.js"></script>
</body>
</html>
