<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科目管理 - Schedule Connect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="app">
        <header id="common-admin-header"></header>

        <div class="page-title-bar">
            <div>
                <h1>科目管理</h1>
                <p class="page-description">授業科目の登録および週あたり必要コマ数の設定（1時限＝2コマ）</p>
            </div>
        </div>

        <section class="form-section">
            <h2 id="form-title">新規登録</h2>
            <form id="subject-form">
                <input type="hidden" id="subject-id">
                <div class="form-group">
                    <label for="name">科目名 <span class="required">*</span></label>
                    <input id="name" required placeholder="例: プログラミング演習">
                </div>
                <div class="form-group">
                    <label for="required-periods">週あたり必要コマ数 <span class="required">*</span></label>
                    <input id="required-periods" type="number" min="2" step="2" required value="2">
                </div>
                <div class="form-group">
                    <label for="grade">対象学年 <span class="required">*</span></label>
                    <select id="grade" required>
                        <option value="2">2年</option>
                        <option value="3">3年</option>
                        <option value="4">4年</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn-primary">登録</button>
                    <button type="button" id="cancel-btn" class="btn-secondary" style="display:none">キャンセル</button>
                </div>
                <p id="form-error" class="error-message" style="display:none"></p>
            </form>
        </section>

        <section class="list-section">
            <h2>科目一覧</h2>
            <div id="loading">読み込み中...</div>
            <table id="subject-table" style="display:none">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>対象学年</th>
                        <th>科目名</th>
                        <th>週あたり必要コマ数（2コマ＝1時限）</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="subject-list"></tbody>
            </table>
            <p id="no-data" style="display:none">科目が登録されていません。</p>
        </section>
    </div>

    <script src="../js/admin_nav.js"></script>
    <script src="../js/subjects.js"></script>
</body>
</html>
