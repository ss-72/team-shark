<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自分の時間割 - Schedule Connect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <div class="brand-logo">
                <span class="brand-name">Schedule Connect</span>
                <span class="system-tag" style="background: #ecfdf5; color: #065f46;">教員ポータル</span>
            </div>
            <div class="nav-user-area">
                <span class="user-badge" id="user-info">教員: 読み込み中...</span>
                <button type="button" class="btn-logout" id="logout-btn" onclick="handleLogout()">ログアウト</button>
            </div>
        </header>

        <div class="page-title-bar">
            <div>
                <h1>自分の時間割</h1>
                <p class="page-description">現在あなたに割り当てられている授業および教室の一覧です</p>
            </div>
        </div>

        <section class="list-section">
            <h2>割当授業一覧</h2>
            <div id="loading">読み込み中...</div>
            <div id="error" class="error-message" style="display:none; margin-bottom: 12px;"></div>
            <table id="my-timetable-table" class="data-table" style="display:none;">
                <thead>
                    <tr>
                        <th>曜日</th>
                        <th>時限</th>
                        <th>科目</th>
                        <th>割当教室</th>
                    </tr>
                </thead>
                <tbody id="my-timetable-list"></tbody>
            </table>
            <p id="no-data" style="display:none;">割り当てられている授業はありません。</p>
        </section>
    </div>

    <script src="../js/my_timetable.js"></script>
</body>
</html>
