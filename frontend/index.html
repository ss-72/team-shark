<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Connect - 高度ITエンジニア科 時間割・教室管理システム</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page-body">
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-brand-title">Schedule Connect</h1>
            <p class="login-subtitle">高度ITエンジニア科 時間割・教室管理システム</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="login-username">ユーザー名</label>
                <input id="login-username" type="text" required autocomplete="username" placeholder="ユーザー名を入力">
            </div>
            <div class="form-group">
                <label for="login-password">パスワード</label>
                <input id="login-password" type="password" required autocomplete="current-password" placeholder="パスワードを入力">
            </div>
            <div class="form-actions" style="margin-top: 24px;">
                <button type="submit" id="login-btn" class="btn-primary" style="width: 100%;">ログイン</button>
            </div>
            <p id="login-error" class="error-message" style="display:none; text-align: center; margin-top: 12px;"></p>
        </form>

        <!-- ?demo=1 指定時のみJSにより表示される控えめなテスト用入力 -->
        <div id="demo-quick-section" class="demo-quick-box" style="display: none;">
            <div class="demo-quick-title">テスト用入力補助</div>
            <div class="demo-quick-buttons">
                <button type="button" class="btn-demo-quick" onclick="fillAdmin()">管理者 (admin)</button>
                <button type="button" class="btn-demo-quick" onclick="fillTeacher()">教員 (teacher)</button>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
